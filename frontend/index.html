<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment System RAG Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 860px; height: 95vh; background: #fff; border-radius: 18px; box-shadow: 0 6px 32px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
    .header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 16px 22px; display: flex; align-items: center; gap: 12px; }
    .header-icon { font-size: 26px; }
    .header-title { font-size: 17px; font-weight: 700; }
    .header-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .clear-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
    .clear-btn:hover { background: rgba(255,255,255,0.2); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .suggestions { padding: 12px 18px 0; display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; border-radius: 20px; padding: 5px 13px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .chip:hover { background: #4338ca; color: #fff; }
    .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
    .msg-row { display: flex; gap: 10px; }
    .msg-row.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; align-self: flex-end; }
    .avatar.bot { background: #1a1a2e; }
    .avatar.usr { background: #4338ca; }
    .msg-body { max-width: 78%; display: flex; flex-direction: column; gap: 6px; }
    .msg-row.user .msg-body { align-items: flex-end; }
    .bubble { padding: 11px 15px; border-radius: 16px; font-size: 13.5px; line-height: 1.65; word-break: break-word; }
    .msg-row.bot .bubble { background: #f8fafc; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; color: #1e293b; }
    .msg-row.user .bubble { background: #4338ca; color: #fff; border-bottom-right-radius: 4px; }
    .bubble strong { font-weight: 600; }
    .bubble code { background: #f1f5f9; color: #0f172a; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; font-family: monospace; }
    .msg-row.user .bubble code { background: rgba(255,255,255,0.2); color:#fff; }
    .bubble ul, .bubble ol { padding-left: 20px; }
    .bubble table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; }
    .bubble th, .bubble td { border: 1px solid #e2e8f0; padding: 5px 10px; text-align: left; }
    .bubble th { background: #f1f5f9; font-weight: 600; }
    .bubble pre { background: #1e293b; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin-top: 6px; }
    .bubble pre code { background: none; color: inherit; padding: 0; }
    .sources-wrap { display: flex; flex-direction: column; gap: 4px; }
    .sources-label { font-size: 10.5px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.6px; }
    .source-cards { display: flex; flex-wrap: wrap; gap: 5px; }
    .source-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 5px 10px; font-size: 11.5px; color: #475569; display: flex; align-items: center; gap: 6px; }
    .score { background: #dcfce7; color: #166534; border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 600; }
    .score.med { background: #fef9c3; color: #854d0e; }
    .score.low { background: #fee2e2; color: #991b1b; }
    .rewrite-badge { font-size: 10.5px; color: #94a3b8; font-style: italic; }
    .rewrite-badge span { color: #4338ca; }
    .typing { display: flex; gap: 4px; padding: 6px 2px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
    .input-area { padding: 14px 18px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: flex-end; }
    textarea { flex: 1; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 9px 13px; font-size: 13.5px; font-family: inherit; resize: none; max-height: 110px; outline: none; transition: border-color 0.2s; line-height: 1.5; color: #1e293b; }
    textarea:focus { border-color: #4338ca; }
    .send-btn { width: 40px; height: 40px; background: #4338ca; color: #fff; border: none; border-radius: 12px; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .send-btn:hover { background: #3730a3; }
    .send-btn:disabled { background: #c7d2fe; cursor: not-allowed; }
    .welcome { text-align: center; color: #94a3b8; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
    .welcome-icon { font-size: 52px; margin-bottom: 14px; }
    .welcome h3 { color: #334155; font-size: 19px; margin-bottom: 8px; }
    .welcome p { font-size: 13px; max-width: 360px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-icon">💳</div>
    <div>
      <div class="header-title">Payment System Assistant</div>
      <div class="header-sub">Groq · LLaMA 3.3 70B · ChromaDB · Streaming + Query Rewriting</div>
    </div>
    <div class="header-actions">
      <button class="clear-btn" onclick="clearChat()">🗑 Clear</button>
      <div class="status-dot"></div>
    </div>
  </div>

  <div class="suggestions">
    <button class="chip" onclick="ask('What are the supported payment methods?')">💳 Payment Methods</button>
    <button class="chip" onclick="ask('Explain the transaction lifecycle')">🔄 Transaction Flow</button>
    <button class="chip" onclick="ask('How does fraud detection work?')">🛡 Fraud Detection</button>
    <button class="chip" onclick="ask('What are the webhook events?')">🔔 Webhooks</button>
    <button class="chip" onclick="ask('How does multi-currency support work?')">💱 Multi-Currency</button>
    <button class="chip" onclick="ask('Explain subscription and recurring payments')">🔁 Subscriptions</button>
    <button class="chip" onclick="ask('What are the key payment analytics metrics?')">📊 Analytics</button>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <h3>Payment System Assistant</h3>
      <p>Ask me anything — fraud detection, multi-currency, subscriptions, webhooks, analytics, and more.</p>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Ask about the payment system…" rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API = "http://localhost:8000";
let history = [];

function autoResize(el) { el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,110)+"px"; }
function handleKey(e) { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();} }
function ask(q) { document.getElementById("input").value=q; sendMessage(); }
function scrollBottom() { const m=document.getElementById("messages"); m.scrollTop=m.scrollHeight; }

function clearChat() {
  history=[];
  document.getElementById("messages").innerHTML=`<div class="welcome" id="welcome">
    <div class="welcome-icon">🤖</div><h3>Payment System Assistant</h3>
    <p>Ask me anything about the payment system.</p></div>`;
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function md(text) {
  return text
    .replace(/```[\w]*\n([\s\S]*?)```/g,(_,c)=>`<pre><code>${esc(c.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`)
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
    .replace(/(\|.+\|\n)((?:\|[-: |]+\|\n))((?:\|.+\|\n?)+)/g, renderTable)
    .replace(/^[-*] (.+)$/gm,"<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)/g,m=>`<ul>${m}</ul>`)
    .replace(/\n{2,}/g,"<br><br>")
    .replace(/\n/g,"<br>");
}

function renderTable(_, header, sep, body) {
  const hcells = header.trim().split("|").filter(Boolean).map(c=>`<th>${c.trim()}</th>`).join("");
  const rows = body.trim().split("\n").map(row=>{
    const cells = row.split("|").filter(Boolean).map(c=>`<td>${c.trim()}</td>`).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  return `<table><thead><tr>${hcells}</tr></thead><tbody>${rows}</tbody></table>`;
}

function scoreBadge(score) {
  const pct = Math.round(score*100);
  const cls = pct>=70?"":pct>=50?"med":"low";
  return `<span class="score ${cls}">${pct}%</span>`;
}

function addUserMsg(text) {
  document.getElementById("welcome")?.remove();
  const m=document.getElementById("messages");
  const row=document.createElement("div"); row.className="msg-row user";
  row.innerHTML=`<div class="avatar usr">🧑</div><div class="msg-body"><div class="bubble">${esc(text)}</div></div>`;
  m.appendChild(row); scrollBottom();
}

function addBotRow() {
  document.getElementById("welcome")?.remove();
  const m=document.getElementById("messages");
  const row=document.createElement("div"); row.className="msg-row bot";
  row.innerHTML=`<div class="avatar bot">🤖</div>
    <div class="msg-body">
      <div class="bubble" id="sb"><div class="typing"><span></span><span></span><span></span></div></div>
      <div class="sources-wrap" id="ss" style="display:none"></div>
      <div class="rewrite-badge" id="sr" style="display:none"></div>
    </div>`;
  m.appendChild(row); scrollBottom();
  return { bubble:document.getElementById("sb"), sources:document.getElementById("ss"), rewrite:document.getElementById("sr") };
}

function showSources(el, sources, query, rewriteEl) {
  const cards = sources.map(s=>`<div class="source-card">${scoreBadge(s.score)}<span><strong>${esc(s.section)}</strong> › ${esc(s.title)}</span></div>`).join("");
  el.innerHTML=`<div class="sources-label">📚 Sources</div><div class="source-cards">${cards}</div>`;
  el.style.display="block";
  if(query){ rewriteEl.innerHTML=`🔍 Searched as: <span>"${esc(query)}"</span>`; rewriteEl.style.display="block"; }
}

async function sendMessage() {
  const input=document.getElementById("input");
  const sendBtn=document.getElementById("sendBtn");
  const text=input.value.trim(); if(!text) return;
  addUserMsg(text); input.value=""; input.style.height="auto"; sendBtn.disabled=true;
  const els=addBotRow(); let answer=""; let firstToken=true;

  try {
    const res=await fetch(`${API}/chat/stream`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history})});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";

    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith("data: ")) continue;
        const raw=line.slice(6); if(raw==="[DONE]") break;
        const evt=JSON.parse(raw);
        if(evt.type==="sources") showSources(els.sources,evt.sources,evt.rewritten_query,els.rewrite);
        if(evt.type==="token"){
          if(firstToken){els.bubble.innerHTML="";firstToken=false;}
          answer+=evt.text; els.bubble.innerHTML=md(answer); scrollBottom();
        }
      }
    }
    history.push({role:"user",content:text});
    history.push({role:"assistant",content:answer});
    if(history.length>20) history=history.slice(-20);
  } catch(err) {
    els.bubble.innerHTML=`⚠️ <strong>Error:</strong> ${err.message}`;
  }
  sendBtn.disabled=false; document.getElementById("input").focus();
}
</script>
</body>
</html>
